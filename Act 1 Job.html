<html>
<head>
<title>Job Application Form</title>
</head>
<body bgcolor="#ADD8E6" align="center">
<h1 align="center" style="font-family: Arial; color: black;"><ul>Company Job Application</ul></h1>
<form align="justified" action="Act 1 - 19 - 2.php" method="get">
<h2 style="font-family: Tahoma; font-weight: bold; color: black;">Personal Information</h2><br>
<label for="fname">First Name:</label><br>
<input type="text" id="fname" name="fname"><br><br>
<label for="lname">Last Name:</label><br>
<input type="text" id="lname" name="lname"><br><br>
<label for="nationality">Nationality:</label><br>
<input type="text" id="nationality" name="nationality"><br><br>
<label for="phone">Phone Number:</label><br>
<input type="tel" id="phone" name="phone"><br><br><br>
<h2 style="font-family: Tahoma; color: black;">Professional Profile & Details</h2><br>
<label>Select Gender:</label><br>
<input type="radio" id="male" name="gender" value="male">
<label for="male">Male</label><br>
<input type="radio" id="female" name="gender" value="female">
<label for="female">Female</label><br>
<input type="radio" id="other" name="gender" value="other">
<label for="other">Others</label><br><br>
<label for="email">Email Address:</label><br>
<input type="email" id="email" name="email"><br><br>
<label for="experience">Years of Experience (0-40):</label><br>
<input type="number" id="experience" name="experience" min="0" max="40"><br><br>
<h2 style="font-family: Tahoma; color: black;">Category & Employment Preferences</h2><br>
<label><b>Position Type:</b></label><br>
<input type="radio" id="fulltime" name="job_type" value="fulltime">
<label for="fulltime">Full-Time</label>
<input type="radio" id="parttime" name="job_type" value="parttime">
<label for="parttime">Part-Time</label>
<input type="radio" id="intern" name="job_type" value="intern">
<label for="intern">Internship</label><br><br>
<input type="checkbox" id="terms" name="terms">
<label for="terms">I agree to the Company Application Policies And Terms.</label><br><br><br>
<input type="submit" value="Submit Application">
<input type="reset" value="Reset Form">
</form>
</body>
</html>
